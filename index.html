  .orb2 { bottom: 15%; right: 15%; animation-delay: 6s; background: radial-gradient(circle, rgba(0,208,132,0.12), transparent 70%); }

  @keyframes float {
    0%, 100% { transform: translateY(0) translateX(0); }
    50% { transform: translateY(-35px) translateX(25px); }
  }

  /* Container */
  .container-home {

    max-width: 800px;

    background: var(--panel);

    text-transform: uppercase;

  }
  @keyframes gradientMove {
    0% { background-position: 0% 50%; }
    33% { background-position: 100% 50%; }
    66% { background-position: 0% 100%; }
    100% { background-position: 0% 50%; }
  }

  h2.title {

  <!-- Merge Files Logic -->
  <script>
    let selectedFiles = [];

    // Toggle Merge Section
    document.getElementById('mergeBtn').addEventListener('click', function() {
      const mergeSection = document.getElementById('mergeSection');
      mergeSection.style.display = mergeSection.style.display === 'none' ? 'block' : 'none';
    });

    // Handle File Selection
    document.getElementById('fileInput').addEventListener('change', function(e) {
      selectedFiles = Array.from(e.target.files);
      displayFileList();
      
      if (selectedFiles.length > 0) {
        document.getElementById('mergeNowBtn').style.display = 'inline-block';
        showStatus(`${selectedFiles.length} file(s) selected`, 'info');
      }
    });

    // Display Selected Files
    function displayFileList() {
      const filesList = document.getElementById('files');
      filesList.innerHTML = '';
      
      if (selectedFiles.length === 0) {
        document.getElementById('fileList').style.display = 'none';
        return;
      }

      document.getElementById('fileList').style.display = 'block';
      
      selectedFiles.forEach((file, index) => {
        const fileItem = document.createElement('div');
        fileItem.className = 'file-item';
        fileItem.innerHTML = `
          <span><i class="fas fa-file-excel"></i> ${file.name}</span>
          <button onclick="removeFile(${index})">Remove</button>
        `;
        filesList.appendChild(fileItem);
      });
    }

    // Remove File from Selection
    function removeFile(index) {
      selectedFiles.splice(index, 1);
      displayFileList();
      
      if (selectedFiles.length === 0) {
        document.getElementById('mergeNowBtn').style.display = 'none';
        document.getElementById('statusMsg').innerHTML = '';
      } else {
        showStatus(`${selectedFiles.length} file(s) selected`, 'info');
      }
    }

    // Show Status Message
    function showStatus(message, type = 'info') {
      const statusDiv = document.getElementById('statusMsg');
      statusDiv.className = `status-msg ${type}`;
      statusDiv.textContent = message;
    }

    // Merge Files and Create Excel
    document.getElementById('mergeNowBtn').addEventListener('click', async function() {
      try {
        showStatus('Processing files...', 'info');
        
        let mergedData = {};
        
        // Read all files
        for (let file of selectedFiles) {
          const arrayBuffer = await file.arrayBuffer();
          const workbook = XLSX.read(arrayBuffer, { type: 'array' });
          
          // Get the first sheet
          const sheetName = workbook.SheetNames[0];
          const worksheet = workbook.Sheets[sheetName];
          const data = XLSX.utils.sheet_to_json(worksheet);
          
          // Process each row
          data.forEach(row => {
            const teamName = row.Team ? row.Team.trim() : '';
            if (teamName) {
              if (!mergedData[teamName]) {
                mergedData[teamName] = {
                  Team: teamName,
                  Total: 0,
                  Booyah: 0,
                  'Kill Points': 0,
                  'Position Points': 0
                };
              }
              
              // Add points
              mergedData[teamName].Total += parseInt(row.Total) || 0;
              mergedData[teamName].Booyah += parseInt(row.Booyah) || 0;
              mergedData[teamName]['Kill Points'] += parseInt(row['Kill Points']) || 0;
              mergedData[teamName]['Position Points'] += parseInt(row['Position Points']) || 0;
            }
          });
        }
        
        // Convert to array and sort by Total (descending)
        let mergedArray = Object.values(mergedData);
        mergedArray.sort((a, b) => b.Total - a.Total);
        
        // Add rank
        mergedArray = mergedArray.map((row, index) => ({
          Rank: index + 1,
          ...row
        }));
        
        // Display in table
        displayMergedTable(mergedArray);
        
        // Create Excel file
        createExcelFile(mergedArray);
        
        showStatus(`âœ“ Successfully merged ${selectedFiles.length} file(s)! Data displayed below.`, 'success');
        
      } catch (error) {
        showStatus(`âœ— Error: ${error.message}`, 'error');
        console.error(error);
      }
    });

    // Display Merged Data in Table
    function displayMergedTable(data) {
      const tbody = document.getElementById('mergedTableBody');
      tbody.innerHTML = '';
      
      data.forEach(row => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${row.Rank}</td>
          <td style="text-align: left;">${row.Team}</td>
          <td>${row.Booyah}</td>
          <td>${row['Kill Points']}</td>
          <td>${row['Position Points']}</td>
          <td style="color: var(--accent); font-weight: bold;">${row.Total}</td>
        `;
        tbody.appendChild(tr);
      });
      
      document.getElementById('mergedTableContainer').style.display = 'block';
    }

    // Create and Download Excel File
    function createExcelFile(data) {
      // Prepare data with Total column at the end
      const exportData = data.map(row => ({
        Rank: row.Rank,
        Team: row.Team,
        Booyah: row.Booyah,
        'Kill Points': row['Kill Points'],
        'Position Points': row['Position Points'],
        Total: row.Total
      }));
      
      const ws = XLSX.utils.json_to_sheet(exportData);
      
      // Set column widths
      ws['!cols'] = [
        { wch: 6 },
        { wch: 25 },
        { wch: 10 },
        { wch: 15 },
        { wch: 18 },
        { wch: 10 }
      ];
      
      // Format header row
      for (let i = 0; i < 6; i++) {
        const cellRef = String.fromCharCode(65 + i) + '1';
        if (ws[cellRef]) {
          ws[cellRef].fill = { fgColor: { rgb: "8a2be2" } };
          ws[cellRef].font = { bold: true, color: { rgb: "FFFFFF" } };
        }
      }
      
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Overall Standings');
      
      const filename = `Merged_Standings_${new Date().getTime()}.xlsx`;
      XLSX.writeFile(wb, filename);
    }
  </script>
